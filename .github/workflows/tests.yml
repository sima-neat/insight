name: Tests

# The test jobs run on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # The MediaMTX integration tests run against the release build.sh bundles.
      - name: Download MediaMTX
        run: |
          set -euo pipefail
          version=$(sed -n 's/^MTX_VERSION="\(.*\)"$/\1/p' build.sh)
          mkdir -p "$RUNNER_TEMP/mediamtx"
          curl -fsSL "https://github.com/bluenviron/mediamtx/releases/download/v${version}/mediamtx_v${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mediamtx" mediamtx
          echo "NEAT_INSIGHT_MEDIAMTX=$RUNNER_TEMP/mediamtx/mediamtx" >> "$GITHUB_ENV"

      - name: Install Insight
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Python tests
        env:
          # ffmpeg is installed above; a missing one must fail the FPS rendition tests, not skip them.
          NEAT_INSIGHT_REQUIRE_FFMPEG_TESTS: "1"
        run: python -m unittest discover -s tests -v

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # The media, relay and MediaMTX tests run the real tools; without them they skip.
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download MediaMTX
        working-directory: .
        run: |
          set -euo pipefail
          version=$(sed -n 's/^MTX_VERSION="\(.*\)"$/\1/p' build.sh)
          mkdir -p "$RUNNER_TEMP/mediamtx"
          curl -fsSL "https://github.com/bluenviron/mediamtx/releases/download/v${version}/mediamtx_v${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mediamtx" mediamtx
          echo "NEAT_INSIGHT_MEDIAMTX=$RUNNER_TEMP/mediamtx/mediamtx" >> "$GITHUB_ENV"

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Generated code matches openapi.yaml
        run: go generate ./... && git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      # The video code must load with the Viewer route only, not with the first paint.
      - name: Check the bundle split
        run: npm run check:bundle

      # The end-to-end tests start the dev server themselves and drive it in Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
