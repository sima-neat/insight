name: Tests

# The one test job: it runs on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # The MediaMTX integration tests run against the release build.sh bundles.
      - name: Download MediaMTX
        run: |
          set -euo pipefail
          version=$(sed -n 's/^MTX_VERSION="\(.*\)"$/\1/p' build.sh)
          mkdir -p "$RUNNER_TEMP/mediamtx"
          curl -fsSL "https://github.com/bluenviron/mediamtx/releases/download/v${version}/mediamtx_v${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mediamtx" mediamtx
          echo "NEAT_INSIGHT_MEDIAMTX=$RUNNER_TEMP/mediamtx/mediamtx" >> "$GITHUB_ENV"

      - name: Install Insight
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Python tests
        env:
          # ffmpeg is installed above; a missing one must fail the FPS rendition tests, not skip them.
          NEAT_INSIGHT_REQUIRE_FFMPEG_TESTS: "1"
        run: python -m unittest discover -s tests -v
