<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Neat Insight development loop</title>
  <desc id="desc">A workflow diagram showing workspace files, media files, and a Neat application connected to Insight workspace inspection, RTSP sources, application output, Video Viewer, and diagnostics.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2d5a70"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102a3a" flood-opacity="0.11"/>
    </filter>
    <style>
      .bg { fill: #f6f9fc; }
      .section { fill: #ffffff; stroke: #d6e1eb; stroke-width: 2; filter: url(#shadow); }
      .input { fill: #edf6ff; stroke: #b7d4ed; }
      .insight { fill: #edf9f6; stroke: #a8d8cf; }
      .app { fill: #fff7e6; stroke: #e4c782; }
      .output { fill: #f3efff; stroke: #c8bbf1; }
      .diagnostics { fill: #eef3f7; stroke: #c8d5df; }
      .title {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #102a3a;
        font-size: 30px;
        font-weight: 800;
      }
      .subtitle {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #486176;
        font-size: 16px;
        font-weight: 500;
      }
      .label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #173145;
        font-size: 20px;
        font-weight: 800;
      }
      .small {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #486176;
        font-size: 15px;
        font-weight: 500;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        fill: #365468;
        font-size: 14px;
      }
      .arrow {
        stroke: #2d5a70;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .arrow-soft {
        stroke: #6c8797;
        stroke-width: 2.6;
        fill: none;
        stroke-dasharray: 8 8;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect class="bg" width="1280" height="640" rx="30"/>
  <text class="title" x="56" y="58">Neat Insight Development Loop</text>
  <text class="subtitle" x="56" y="88">Use Insight in the Neat Development Environment or directly on a DevKit.</text>

  <rect class="section input" x="72" y="132" width="260" height="112" rx="18"/>
  <text class="label" x="104" y="178">Workspace files</text>
  <text class="small" x="104" y="207">Source, models, logs,</text>
  <text class="small" x="104" y="229">packages, and artifacts</text>

  <rect class="section input" x="510" y="132" width="260" height="112" rx="18"/>
  <text class="label" x="542" y="178">Media files</text>
  <text class="small" x="542" y="207">Uploaded or bundled test</text>
  <text class="small" x="542" y="229">videos and images</text>

  <rect class="section app" x="948" y="132" width="260" height="112" rx="18"/>
  <text class="label" x="980" y="178">Neat application</text>
  <text class="small" x="980" y="207">Runs with Neat Library</text>
  <text class="small" x="980" y="229">in SDK or on DevKit</text>

  <rect class="section insight" x="72" y="330" width="260" height="112" rx="18"/>
  <text class="label" x="104" y="376">Workspace tab</text>
  <text class="small" x="104" y="405">Inspect files and outputs</text>

  <rect class="section insight" x="510" y="330" width="260" height="112" rx="18"/>
  <text class="label" x="542" y="376">RTSP Source tab</text>
  <text class="small" x="542" y="405">Turn media into streams</text>
  <text class="mono" x="542" y="428">rtsp://.../srcN</text>

  <rect class="section output" x="948" y="330" width="260" height="132" rx="18"/>
  <text class="label" x="980" y="376">Application output</text>
  <text class="mono" x="980" y="406">video UDP 9000-9079</text>
  <text class="mono" x="980" y="430">metadata UDP 9100-9179</text>

  <rect class="section insight" x="510" y="510" width="260" height="92" rx="18"/>
  <text class="label" x="542" y="550">Video Viewer tab</text>
  <text class="small" x="542" y="578">WebRTC rendering and overlays</text>

  <rect class="section diagnostics" x="948" y="510" width="260" height="92" rx="18"/>
  <text class="label" x="980" y="550">Stats and logs</text>
  <text class="small" x="980" y="578">Diagnostics placeholder</text>

  <path class="arrow" d="M202 244 L202 322"/>
  <path class="arrow" d="M640 244 L640 322"/>
  <path class="arrow" d="M1078 244 L1078 322"/>
  <path class="arrow" d="M332 386 L502 386"/>
  <path class="arrow" d="M770 386 L940 386"/>
  <path class="arrow" d="M948 462 C888 520, 828 556, 778 556"/>
  <path class="arrow-soft" d="M770 556 L940 556"/>
</svg>
