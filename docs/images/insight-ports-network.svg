<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Insight SDK port map and media paths</title>
  <desc id="desc">Network diagram showing browser HTTP access, DevKit RTSP and UDP traffic, and vf WebRTC media and DataChannel egress through SDK host-published ports.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102a3a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f5f8fb; }
      .zone { fill: #ffffff; stroke: #d7e2eb; stroke-width: 2; filter: url(#shadow); }
      .external { fill: #eef6ff; stroke: #bbd8ef; }
      .host { fill: #fff8e8; stroke: #e7cf91; }
      .container { fill: #effaf6; stroke: #afdcd2; }
      .box { fill: #ffffff; stroke: #ccd9e4; stroke-width: 1.6; }
      .tcp { fill: #eef7ff; stroke: #b8d6ef; }
      .udp { fill: #f4efff; stroke: #cdbff5; }
      .rtsp { fill: #eefbf7; stroke: #a8d8ce; }
      .title {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #102a3a;
        font-size: 34px;
        font-weight: 800;
      }
      .subtitle {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #50687a;
        font-size: 17px;
        font-weight: 500;
      }
      .zone-title {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #173145;
        font-size: 23px;
        font-weight: 800;
      }
      .label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #173145;
        font-size: 18px;
        font-weight: 800;
      }
      .small {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #4f687b;
        font-size: 14px;
        font-weight: 500;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        fill: #345469;
        font-size: 14px;
        font-weight: 650;
      }
      .lane {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #29485e;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0;
      }
      .tcp-arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .udp-arrow { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrow-purple); }
      .rtsp-arrow { stroke: #0f766e; stroke-width: 3; fill: none; marker-end: url(#arrow-teal); }
      .internal { stroke: #7c3aed; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow-purple); }
      .note { fill: #eaf1f7; stroke: #d0dde7; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900" rx="34"/>
  <text class="title" x="56" y="62">Insight Ports and Network Paths</text>
  <text class="subtitle" x="56" y="94">Use `neat --json` as the source of truth because SDK host ports can be remapped.</text>

  <rect class="zone external" x="56" y="132" width="330" height="672" rx="24"/>
  <text class="zone-title" x="92" y="180">External clients</text>

  <rect class="box" x="92" y="222" width="258" height="190" rx="18"/>
  <text class="label" x="124" y="266">Browser client</text>
  <text class="small" x="124" y="296">Loads Insight and Video Viewer</text>
  <text class="small" x="124" y="322">Receives WebRTC media</text>
  <text class="small" x="124" y="348">and metadata DataChannel</text>
  <text class="mono" x="124" y="378">HTTPS + WebRTC/UDP</text>

  <rect class="box" x="92" y="548" width="258" height="178" rx="18"/>
  <text class="label" x="124" y="592">Modalix DevKit</text>
  <text class="small" x="124" y="622">Pulls RTSP sources</text>
  <text class="small" x="124" y="648">Runs Neat applications</text>
  <text class="small" x="124" y="674">Sends RTP video + metadata</text>
  <text class="mono" x="124" y="704">RTSP/TCP + UDP</text>

  <rect class="zone host" x="488" y="132" width="362" height="672" rx="24"/>
  <text class="zone-title" x="524" y="180">SDK host machine</text>
  <text class="small" x="524" y="208">Host-published ports from the SDK container</text>

  <rect class="box tcp" x="528" y="238" width="282" height="70" rx="15"/>
  <text class="label" x="558" y="266">mainUI</text>
  <text class="mono" x="558" y="292">TCP hostPortStart -> 9900</text>

  <rect class="box tcp" x="528" y="332" width="282" height="70" rx="15"/>
  <text class="label" x="558" y="360">videoUI</text>
  <text class="mono" x="558" y="386">TCP hostPortStart -> 8081</text>

  <rect class="box udp" x="528" y="426" width="282" height="78" rx="15"/>
  <text class="label" x="558" y="456">webRTC</text>
  <text class="mono" x="558" y="482">UDP host range -> 40000-40199</text>

  <rect class="box rtsp" x="528" y="536" width="282" height="70" rx="15"/>
  <text class="label" x="558" y="564">rtsp.tcp</text>
  <text class="mono" x="558" y="590">TCP hostPortStart -> 8554</text>

  <rect class="box udp" x="528" y="630" width="282" height="78" rx="15"/>
  <text class="label" x="558" y="660">videoUDP</text>
  <text class="mono" x="558" y="686">UDP host range -> 9000-9079</text>

  <rect class="box udp" x="528" y="732" width="282" height="78" rx="15"/>
  <text class="label" x="558" y="762">metadataUDP</text>
  <text class="mono" x="558" y="788">UDP host range -> 9100-9179</text>

  <rect class="zone container" x="956" y="132" width="588" height="672" rx="24"/>
  <text class="zone-title" x="992" y="180">SDK container: Insight and vf</text>
  <text class="small" x="992" y="208">Internal service ports stay stable; host ports may be remapped.</text>

  <rect class="box tcp" x="1000" y="238" width="240" height="70" rx="15"/>
  <text class="label" x="1030" y="266">Insight API + UI</text>
  <text class="mono" x="1030" y="292">9900/tcp</text>

  <rect class="box tcp" x="1260" y="332" width="240" height="82" rx="15"/>
  <text class="label" x="1290" y="360">vf HTTP viewer</text>
  <text class="small" x="1290" y="384">static UI + /offer signaling</text>
  <text class="mono" x="1290" y="404">8081/tcp</text>

  <rect class="box udp" x="1260" y="438" width="240" height="92" rx="15"/>
  <text class="label" x="1290" y="468">vf WebRTC egress</text>
  <text class="small" x="1290" y="492">media + metadata DataChannel</text>
  <text class="mono" x="1290" y="514">40000-40199/udp</text>

  <rect class="box rtsp" x="1000" y="536" width="240" height="70" rx="15"/>
  <text class="label" x="1030" y="564">RTSP source server</text>
  <text class="mono" x="1030" y="590">8554/tcp</text>

  <rect class="box udp" x="1000" y="630" width="240" height="78" rx="15"/>
  <text class="label" x="1030" y="660">vf RTP ingest</text>
  <text class="mono" x="1030" y="686">9000-9079/udp</text>

  <rect class="box udp" x="1000" y="732" width="240" height="78" rx="15"/>
  <text class="label" x="1030" y="762">vf metadata ingest</text>
  <text class="mono" x="1030" y="788">9100-9179/udp</text>

  <rect class="note" x="956" y="824" width="588" height="48" rx="16"/>
  <text class="small" x="992" y="855">For channel N: video uses start + N, metadata uses start + N.</text>

  <text class="lane" x="398" y="252">HTTPS</text>
  <path class="tcp-arrow" d="M350 272 L520 272"/>
  <path class="tcp-arrow" d="M810 272 L992 272"/>

  <text class="lane" x="398" y="346">HTTPS viewer + signaling</text>
  <path class="tcp-arrow" d="M350 366 L520 366"/>
  <path class="tcp-arrow" d="M810 366 L1252 366"/>

  <text class="lane" x="400" y="438">WebRTC media + DataChannel</text>
  <path class="udp-arrow" d="M1260 482 L818 482"/>
  <path class="udp-arrow" d="M528 466 L350 376"/>

  <text class="lane" x="398" y="548">RTSP pull from Insight</text>
  <path class="rtsp-arrow" d="M1000 572 L818 572"/>
  <path class="rtsp-arrow" d="M528 572 L350 620"/>

  <text class="lane" x="398" y="652">RTP video ingest</text>
  <path class="udp-arrow" d="M350 668 L520 668"/>
  <path class="udp-arrow" d="M810 668 L992 668"/>

  <text class="lane" x="398" y="754">JSON metadata ingest</text>
  <path class="udp-arrow" d="M350 696 L520 770"/>
  <path class="udp-arrow" d="M810 770 L992 770"/>

  <path class="internal" d="M1240 668 L1340 668 L1340 538"/>
  <path class="internal" d="M1240 770 L1378 770 L1378 538"/>
  <text class="small" x="1280" y="636">vf forwards ingested streams</text>
  <text class="small" x="1280" y="656">into WebRTC tracks/DataChannel</text>
</svg>
