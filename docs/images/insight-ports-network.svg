<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Insight ports and network paths</title>
  <desc id="desc">Network diagram showing browser and DevKit access to Insight through SDK host-published ports and the corresponding container ports.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#29556c"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6a8291"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#102a3a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f5f8fb; }
      .zone { fill: #ffffff; stroke: #d6e1eb; stroke-width: 2; filter: url(#shadow); }
      .external { fill: #eef6ff; stroke: #b8d4ec; }
      .host { fill: #fff7e6; stroke: #e4c783; }
      .container { fill: #edf9f6; stroke: #a8d8cf; }
      .service { fill: #ffffff; stroke: #cddae4; stroke-width: 1.5; }
      .udp { fill: #f4f0ff; stroke: #cbbff2; }
      .tcp { fill: #eef7ff; stroke: #b9d6ef; }
      .title {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #102a3a;
        font-size: 34px;
        font-weight: 800;
      }
      .subtitle {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #50687a;
        font-size: 17px;
        font-weight: 500;
      }
      .zone-title {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #163145;
        font-size: 23px;
        font-weight: 800;
      }
      .label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #173145;
        font-size: 18px;
        font-weight: 800;
      }
      .small {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        fill: #4f687b;
        font-size: 14px;
        font-weight: 500;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        fill: #345469;
        font-size: 14px;
        font-weight: 600;
      }
      .arrow { stroke: #29556c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-bidir { stroke: #29556c; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #6a8291; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow-soft); }
      .note { fill: #eaf1f7; stroke: #d0dde7; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900" rx="34"/>
  <text class="title" x="56" y="62">Insight Ports and Network Paths</text>
  <text class="subtitle" x="56" y="94">Use `neat --json` as the source of truth when SDK host ports are remapped.</text>

  <rect class="zone external" x="56" y="140" width="340" height="640" rx="24"/>
  <text class="zone-title" x="92" y="188">External clients</text>

  <rect class="service" x="92" y="226" width="268" height="126" rx="18"/>
  <text class="label" x="124" y="270">Host-side browser</text>
  <text class="small" x="124" y="300">Opens Insight UI</text>
  <text class="small" x="124" y="324">and Video Viewer</text>

  <rect class="service" x="92" y="448" width="268" height="156" rx="18"/>
  <text class="label" x="124" y="492">Modalix DevKit</text>
  <text class="small" x="124" y="522">Consumes RTSP sources</text>
  <text class="small" x="124" y="546">Sends app video + metadata</text>
  <text class="small" x="124" y="570">to SDK-hosted Insight</text>

  <rect class="zone host" x="472" y="140" width="382" height="640" rx="24"/>
  <text class="zone-title" x="508" y="188">SDK host machine</text>
  <text class="small" x="508" y="216">Browser-facing and DevKit-facing ports</text>

  <rect class="service tcp" x="516" y="258" width="294" height="78" rx="16"/>
  <text class="label" x="548" y="290">mainUI</text>
  <text class="mono" x="548" y="316">TCP hostPortStart -> 9900</text>

  <rect class="service tcp" x="516" y="360" width="294" height="78" rx="16"/>
  <text class="label" x="548" y="392">videoUI</text>
  <text class="mono" x="548" y="418">TCP hostPortStart -> 8081</text>

  <rect class="service tcp" x="516" y="462" width="294" height="78" rx="16"/>
  <text class="label" x="548" y="494">rtsp.tcp</text>
  <text class="mono" x="548" y="520">TCP hostPortStart -> 8554</text>

  <rect class="service udp" x="516" y="564" width="294" height="86" rx="16"/>
  <text class="label" x="548" y="596">videoUDP</text>
  <text class="mono" x="548" y="622">host range -> 9000-9079</text>

  <rect class="service udp" x="516" y="674" width="294" height="86" rx="16"/>
  <text class="label" x="548" y="706">metadataUDP</text>
  <text class="mono" x="548" y="732">host range -> 9100-9179</text>

  <rect class="zone container" x="930" y="140" width="614" height="640" rx="24"/>
  <text class="zone-title" x="966" y="188">SDK container: Insight services</text>
  <text class="small" x="966" y="216">Default internal ports remain stable inside the container</text>

  <rect class="service tcp" x="980" y="258" width="236" height="78" rx="16"/>
  <text class="label" x="1012" y="290">Insight API + UI</text>
  <text class="mono" x="1012" y="316">9900/tcp</text>

  <rect class="service tcp" x="1258" y="258" width="236" height="78" rx="16"/>
  <text class="label" x="1290" y="290">Video Viewer UI</text>
  <text class="mono" x="1290" y="316">8081/tcp</text>

  <rect class="service tcp" x="980" y="462" width="236" height="78" rx="16"/>
  <text class="label" x="1012" y="494">RTSP sources</text>
  <text class="mono" x="1012" y="520">8554/tcp</text>

  <rect class="service udp" x="980" y="578" width="236" height="86" rx="16"/>
  <text class="label" x="1012" y="610">Video ingest</text>
  <text class="mono" x="1012" y="636">9000-9079/udp</text>

  <rect class="service udp" x="1258" y="578" width="236" height="86" rx="16"/>
  <text class="label" x="1290" y="610">Metadata ingest</text>
  <text class="mono" x="1290" y="636">9100-9179/udp</text>

  <rect class="service udp" x="1258" y="360" width="236" height="98" rx="16"/>
  <text class="label" x="1290" y="392">WebRTC Media</text>
  <text class="label" x="1290" y="416">&amp; DataChannel</text>
  <text class="mono" x="1290" y="442">40000-40199/udp</text>

  <rect class="note" x="980" y="690" width="514" height="54" rx="16"/>
  <text class="small" x="1012" y="724">For channel N: video uses start + N, metadata uses start + N.</text>

  <path class="arrow" d="M360 286 L508 286"/>
  <path class="arrow" d="M810 297 L972 297"/>
  <path class="arrow-soft" d="M1258 297 C1168 244, 926 244, 818 399"/>
  <path class="arrow-soft" d="M516 399 C430 399, 416 316, 368 316"/>

  <path class="arrow-soft" d="M980 501 L818 501"/>
  <path class="arrow-soft" d="M516 501 L368 501"/>

  <path class="arrow" d="M360 540 C430 540, 438 607, 508 607"/>
  <path class="arrow" d="M810 607 L972 621"/>
  <path class="arrow" d="M360 570 C430 570, 438 717, 508 717"/>
  <path class="arrow" d="M810 717 C936 717, 1100 646, 1250 622"/>
  <path class="arrow" d="M1216 621 C1246 612, 1272 520, 1318 466"/>
  <path class="arrow" d="M1376 578 L1376 466"/>
  <path class="arrow" d="M1376 360 L1376 344"/>

  <text class="small" x="404" y="264">HTTPS</text>
  <text class="small" x="404" y="382">viewer rendering</text>
  <text class="small" x="404" y="474">RTSP source</text>
  <text class="small" x="404" y="588">RTP video</text>
  <text class="small" x="404" y="696">JSON metadata</text>
</svg>
