<div class="form">
  <neat-field class="url" label="YouTube URL"
    ><input
      #url
      neatInput
      size="small"
      type="url"
      placeholder="https://www.youtube.com/watch?v=..."
      [value]="state.url()"
      [disabled]="runner.busy()"
      (input)="setUrl(url.value)"
  /></neat-field>
  <neat-select
    label="Target Resolution & FPS"
    showLabel
    size="small"
    [options]="targets"
    [value]="state.target()"
    [disabled]="runner.busy()"
    (valueChange)="state.target.set($event ?? '1080p30')"
  />
  <neat-field label="Start Time"
    ><input
      #start
      neatInput
      size="small"
      type="text"
      inputmode="numeric"
      placeholder="0:00"
      [value]="state.start()"
      [disabled]="runner.busy()"
      (input)="state.start.set(start.value)"
  /></neat-field>
  <neat-select
    label="Clip Length"
    showLabel
    size="small"
    [options]="lengths"
    [value]="state.length()"
    [disabled]="runner.busy()"
    (valueChange)="state.length.set($event ?? 300)"
  />
  <button
    neatButton
    type="button"
    variant="outlined"
    size="small"
    [disabled]="runner.busy() || state.validating() || !state.url().trim()"
    (click)="validate()"
  >
    {{ state.validating() ? 'Validating...' : 'Validate' }}
  </button>
</div>

@if (state.error(); as error) {
  <neat-error-note>{{ error }}</neat-error-note>
}

<app-import-preview [heading]="previewHeading()" [notes]="previewNotes()">
  @if (state.preview(); as preview) {
    <iframe
      title="YouTube preview"
      [appYoutubeEmbed]="preview.embed_url"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      allowfullscreen
    ></iframe>
  } @else {
    <p neatNote>Validate a YouTube link to show the preview before import.</p>
  }
</app-import-preview>

<app-import-summary
  [heading]="state.preview() ? 'Ready to import YouTube video' : 'Validate a YouTube URL'"
  [notes]="[state.target() + ' / ' + minutes() + ' min max / H.264 / WebRTC-friendly import']"
>
  @if (importing()) {
    <button neatButton type="button" variant="danger-text" (click)="cancel()">Cancel Import</button>
  }
  <button neatButton type="button" [disabled]="!canImport()" (click)="importClip()">
    {{ importing() ? 'Importing...' : 'Import' }}
  </button>
</app-import-summary>
