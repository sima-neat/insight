<ng-container *neatPageToolbar>
  <span class="field-label" aria-hidden="true">Size</span>
  <span class="size-field">
    <neat-slider
      label="Tile size"
      [min]="minTileWidth"
      [max]="sliderMax()"
      [step]="1"
      [value]="tileWidth()"
      (valueChange)="rememberTileWidth($event)"
    />
  </span>
  <button
    neatButton
    type="button"
    variant="text"
    size="small"
    iconOnly
    aria-label="Fit all"
    neatTooltip="Fit all"
    neatTooltipPosition="bottom"
    [disabled]="!sizeChosen()"
    (click)="fitAll()"
  >
    <neat-icon name="fit-all" />
  </button>

  <span class="separator" aria-hidden="true"></span>

  <button
    neatButton
    type="button"
    variant="text"
    size="small"
    iconOnly
    aria-label="Previous page"
    neatTooltip="Previous page"
    neatTooltipPosition="bottom"
    [disabled]="state.page() === 0"
    (click)="state.previous()"
  >
    <neat-icon name="previous" />
  </button>
  <label class="field">
    Page
    <span class="number-field">
      <input
        #pageInput
        neatInput
        size="small"
        inputmode="numeric"
        aria-label="Page"
        [value]="state.page() + 1"
        (keydown.enter)="goToPage(pageInput)"
        (blur)="showCurrentPage(pageInput)"
      />
    </span>
    of {{ state.pageCount() }}
  </label>
  <button
    neatButton
    type="button"
    variant="text"
    size="small"
    iconOnly
    aria-label="Next page"
    neatTooltip="Next page"
    neatTooltipPosition="bottom"
    [disabled]="state.page() === state.pageCount() - 1"
    (click)="state.next()"
  >
    <neat-icon name="next" />
  </button>

  <span class="separator" aria-hidden="true"></span>

  <neat-popover label="Go to channel" align="end" [(open)]="channelJumpOpen">
    <button
      neatButton
      neatPopoverTrigger
      type="button"
      variant="text"
      size="small"
      iconOnly
      aria-label="Go to channel"
      neatTooltip="Go to channel"
      neatTooltipPosition="bottom"
    >
      <neat-icon name="search" />
    </button>
    <ng-template neatPopoverContent>
      <input
        #channelInput
        neatInput
        inputmode="numeric"
        aria-label="Channel"
        aria-describedby="channel-jump-hint"
        [placeholder]="channelRange()"
        (keydown.enter)="jumpToChannel(channelInput)"
      />
      <p id="channel-jump-hint" class="hint">Enter turns to its page and selects it.</p>
    </ng-template>
  </neat-popover>
  <neat-popover label="View options" align="end">
    <button
      neatButton
      neatPopoverTrigger
      type="button"
      variant="text"
      size="small"
      iconOnly
      aria-label="View options"
      neatTooltip="View options"
      neatTooltipPosition="bottom"
    >
      <neat-icon name="more" />
    </button>
    <ng-template neatPopoverContent>
      <button neatSwitch [checked]="prefs.bars()" (checkedChange)="prefs.setBars($event)">
        Bars
      </button>
      <span class="option">
        <button
          neatSwitch
          [checked]="prefs.hideEmpty()"
          (checkedChange)="prefs.setHideEmpty($event)"
        >
          Hide empty slots
        </button>
        <span class="tag">Experimental</span>
      </span>
    </ng-template>
  </neat-popover>
  <button
    #inspectorToggle
    neatButton
    type="button"
    variant="text"
    size="small"
    iconOnly
    aria-label="Inspector"
    neatTooltip="Inspector"
    neatTooltipPosition="bottom"
    [pressed]="prefs.inspector()"
    (click)="toggleInspector()"
  >
    <neat-icon name="info" />
  </button>
</ng-container>

<neat-page scroll="none" padding="none" [aside]="prefs.inspector() ? 'open' : 'closed'">
  <div class="grid-area">
    <p class="notice" role="status">
      @if (liveUnknown()) {
        Live channels unknown: ingest stats unavailable
      }
    </p>
    <neat-tile-grid
      [tileWidth]="tileWidth()"
      [count]="state.pageChannels().length"
      (layout)="onLayout($event)"
    >
      @for (channel of state.pageChannels(); track channel) {
        <app-viewer-tile
          tabindex="0"
          [channel]="channel"
          [bars]="prefs.bars()"
          [selected]="state.selected() === channel"
          (click)="state.select(channel)"
          (keydown.enter)="state.select(channel)"
          (lateNotice)="openLateNotice(channel)"
        />
      }
    </neat-tile-grid>
    @if (emptyText(); as text) {
      <p class="empty">{{ text }}</p>
    }
  </div>

  @if (prefs.inspector()) {
    <app-viewer-inspector
      neatPageAside
      [channel]="selectedChannel()"
      [(tab)]="inspectorTab"
      (dismiss)="closeInspector()"
    />
  }
</neat-page>
