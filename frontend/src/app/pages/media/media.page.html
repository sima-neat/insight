<ng-container *neatPageToolbar>
  <button neatButton type="button" variant="text" size="small" (click)="openImport()">
    <neat-icon name="upload" />
    Import…
  </button>
  <button
    neatButton
    type="button"
    variant="text"
    size="small"
    iconOnly
    aria-label="Side panel"
    neatTooltip="Side panel"
    neatTooltipPosition="bottom"
    [pressed]="asideOpen()"
    (click)="toggleAside()"
  >
    <neat-icon name="info" />
  </button>
</ng-container>

<neat-page scroll="none" [aside]="asideOpen() ? 'open' : 'closed'">
  <div class="library">
    <app-slots-notice />
    @if (loading()) {
      <p neatNote>Loading media…</p>
    } @else {
      <neat-file-browser
        mode="manage"
        [rootLabel]="rootLabel"
        [root]="nodes()"
        [countLabel]="countLabel"
        [labels]="labels"
        [filterPlaceholder]="placeholder()"
        [(folder)]="folder"
        [(selected)]="selected"
        [(checked)]="checked"
      >
        <ng-template neatColumn="inUse" header="In use" width="minmax(0, 1fr)" let-file>
          <app-cell-text>{{ inUseOf(file.path) }}</app-cell-text>
        </ng-template>
      </neat-file-browser>
    }
  </div>

  @if (asideOpen()) {
    <section neatPageAside aria-label="Selected media">
      <app-media-panel [(selected)]="selected" [(checked)]="checked" />
    </section>
  }
</neat-page>
